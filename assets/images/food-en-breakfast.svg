  <ellipse cx="500" cy="420" rx="86" ry="52" fill="#fffdf7"/>
  <ellipse cx="500" cy="424" rx="44" ry="30" fill="#f6c84b"/>
  <ellipse cx="500" cy="422" rx="26" ry="18" fill="#f8b63a"/>
