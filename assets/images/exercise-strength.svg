<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf0e2"/><stop offset="1" stop-color="#f7e0c6"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8f98"/><stop offset="1" stop-color="#5d626b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="40" fill="url(#bg)"/>
  <ellipse cx="400" cy="640" rx="300" ry="26" fill="#e2c9a8" opacity="0.5"/>
