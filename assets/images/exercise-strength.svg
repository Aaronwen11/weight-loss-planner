    <path d="M336 160 q40 -34 66 -6 q10 22 4 44 q-34 6 -70 -38 z" fill="#5a4028"/>
    <path d="M340 210 q30 60 4 130 l-26 -4 q26 -64 4 -112 z" fill="#2c8c63"/>
