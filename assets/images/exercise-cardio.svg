<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4ec"/><stop offset="1" stop-color="#d3ead9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="40" fill="url(#bg)"/>
  <ellipse cx="400" cy="640" rx="300" ry="26" fill="#b9d6c2" opacity="0.6"/>
  <!-- 心率线 -->
  <path d="M120 300 h90 l24 -34 30 80 30 -110 28 64 h90" fill="none" stroke="#e0604f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="300" r="12" fill="#e0604f"/>
  <!-- 跑者 -->
  <g>
    <!-- 头 -->
    <circle cx="430" cy="300" r="42" fill="#f2c39b"/>
    <path d="M400 282 q30 -40 66 -8 q-12 8 -22 8 q-14 -6 -26 -2 q-14 4 -18 2 z" fill="#5a4028"/>
    <!-- 身体 -->
    <path d="M408 342 q58 -10 92 26 l-6 26 q-44 -30 -96 -18 z" fill="#2c8c63"/>
    <path d="M436 356 l14 74 -20 6 -14 -74 z" fill="#2c8c63"/>
    <path d="M470 380 l52 44 16 -14 -56 -48 z" fill="#2c8c63"/>
    <!-- 手臂（摆臂） -->
    <path d="M470 356 q40 6 66 34 l-18 16 q-26 -24 -58 -30 z" fill="#f2c39b"/>
    <path d="M420 366 q-44 -6 -68 -36 l18 -16 q24 24 62 30 z" fill="#f2c39b"/>
    <!-- 腿 -->
    <path d="M430 448 q-10 34 -8 74 l-24 4 q-6 -44 6 -84 z" fill="#2c5d47"/>
    <path d="M446 448 q34 22 52 62 l-24 10 q-16 -36 -44 -52 z" fill="#2c5d47"/>
    <!-- 鞋 -->
    <path d="M392 520 h44 q14 0 14 14 l-58 6 q-18 -4 -14 -14 z" fill="#fff"/>
    <path d="M474 516 h52 q14 0 14 14 l-60 6 q-16 -4 -12 -14 z" fill="#fff"/>
    <!-- 运动轨迹线 -->
    <path d="M300 430 q-24 -20 -20 -54" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M322 456 q-20 -14 -14 -44" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- 速度线 -->
  <path d="M560 300 h70" stroke="#4aa3c2" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
  <path d="M580 340 h46" stroke="#4aa3c2" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <path d="M600 380 h34" stroke="#4aa3c2" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <!-- 跑道弧线 -->
  <path d="M120 600 q280 -120 560 0" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
